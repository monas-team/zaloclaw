name: CI

on:
  push:
    branches: [main, "compat/**"]
  pull_request:
    branches: [main]

jobs:
  compat:
    name: compat (openclaw ${{ matrix.openclaw }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # Pinned verified stable + "next" to catch upstream breakage early.
        # Only the pinned entry is required to merge; see `continue-on-error`.
        openclaw:
          - "2026.10.7"
          - "latest"
        include:
          - openclaw: "latest"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install target OpenClaw
        run: npm install --no-save "openclaw@${{ matrix.openclaw }}"
      - name: Compatibility gate
        # exports check + tsc + vitest + build + import smoke + no-native-addon guard
        run: node scripts/compat-check.mjs --no-write
      - name: Secret scan (never ship credentials)
        run: |
          set -e
          if git ls-files | grep -Ei 'credentials|cookie|session-.*\.json|qr-.*\.png|\.env$'; then
            echo "::error::credential-like file tracked in git"; exit 1; fi
          if grep -rEn 'zpw_sek|zpw_enk|"imei"\s*:\s*"[0-9a-f-]{8,}' --include='*.ts' --include='*.json' --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::possible Zalo secret in source"; exit 1; fi
      - name: Upload bundle
        if: matrix.openclaw == '2026.10.7' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: zaloclaw-dist
          path: dist/index.js

  release-artifact:
    needs: compat
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm install --no-save openclaw@2026.10.7
      - run: npm run build
      - name: Pack + checksum
        run: |
          npm pack --silent
          sha256sum zaloclaw-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zaloclaw-release
          path: |
            zaloclaw-*.tgz
            SHA256SUMS
            CHANGELOG.md
