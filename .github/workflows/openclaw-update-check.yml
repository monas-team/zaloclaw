name: OpenClaw update check

# Safe auto-update: DETECT a new OpenClaw stable, run the full compat gate
# against it, and open a PR with the result. This workflow never bumps
# production and never merges by itself. A human merges the PR, then follows
# docs/UPGRADE.md (canary on a secondary Zalo account first).

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve pinned vs latest
        id: ver
        run: |
          PINNED=$(node -p "require('./package.json').openclaw.build.openclawVersion")
          LATEST=$(npm view openclaw version)
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED latest=$LATEST"

      - name: Nothing to do
        if: steps.ver.outputs.pinned == steps.ver.outputs.latest
        run: echo "already on latest stable"

      - name: Install deps + candidate OpenClaw
        if: steps.ver.outputs.pinned != steps.ver.outputs.latest
        run: |
          npm ci
          npm install --no-save "openclaw@${{ steps.ver.outputs.latest }}"

      - name: Run compat gate against candidate
        if: steps.ver.outputs.pinned != steps.ver.outputs.latest
        id: gate
        continue-on-error: true
        run: node scripts/compat-check.mjs 2>&1 | tee gate.log

      - name: Bump pins if gate passed
        if: steps.ver.outputs.pinned != steps.ver.outputs.latest && steps.gate.outcome == 'success'
        run: |
          V="${{ steps.ver.outputs.latest }}"
          # Derive bounded range: >=V <next_minor
          MINOR=$(echo "$V" | sed 's/\.[0-9]*$//')
          NEXT_MINOR=$(echo "$MINOR" | awk -F. '{printf "%s.%d.0", $1, $2+1}')
          node -e '
            const fs=require("fs"); const v=process.argv[1]; const bound=process.argv[2];
            const range=">="+v+" <"+bound;
            const p=JSON.parse(fs.readFileSync("package.json","utf8"));
            p.openclaw.compat.pluginApi=range; p.openclaw.compat.minGatewayVersion=v;
            p.openclaw.build.openclawVersion=v; p.openclaw.build.pluginSdkVersion=v;
            p.peerDependencies.openclaw=range;
            fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n");
            const m=JSON.parse(fs.readFileSync("openclaw.plugin.json","utf8"));
            m.compat={pluginApi:range,minGatewayVersion:v};
            fs.writeFileSync("openclaw.plugin.json", JSON.stringify(m,null,2)+"\n");
          ' "$V" "$NEXT_MINOR"
          # Update CI matrix pinned version (YAML indent-aware)
          node -e '
            const fs=require("fs"); const v=process.argv[1];
            let ci=fs.readFileSync(".github/workflows/ci.yml","utf8");
            ci=ci.replace(/(openclaw:\n\s+- ")[^"]+(")/,"\$1"+v+"\$2");
            fs.writeFileSync(".github/workflows/ci.yml",ci);
          ' "$V"
          # Update docs/COMPAT.md pinned target
          node -e '
            const fs=require("fs"); const v=process.argv[1]; const bound=process.argv[2];
            const range=">="+v+" <"+bound;
            let md=fs.readFileSync("docs/COMPAT.md","utf8");
            md=md.replace(/OpenClaw stable verified \| [^\n]+/,"OpenClaw stable verified | "+v);
            md=md.replace(/pluginApi.*\| [^\n]+/,"pluginApi`) | "+range);
            md=md.replace(/minGatewayVersion.*\| [^\n]+/,"minGatewayVersion`) | "+v);
            fs.writeFileSync("docs/COMPAT.md",md);
          ' "$V" "$NEXT_MINOR"

      - name: Read gate log
        if: steps.ver.outputs.pinned != steps.ver.outputs.latest
        id: gatelog
        run: |
          if [ -f gate.log ]; then
            # Escape for GH Actions multiline output
            LOG=$(cat gate.log)
            echo "content<<GATELOG_EOF" >> "$GITHUB_OUTPUT"
            echo "$LOG" >> "$GITHUB_OUTPUT"
            echo "GATELOG_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "content=see workflow run" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.ver.outputs.pinned != steps.ver.outputs.latest
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/openclaw-${{ steps.ver.outputs.latest }}
          title: "deps: OpenClaw ${{ steps.ver.outputs.pinned }} → ${{ steps.ver.outputs.latest }} (gate: ${{ steps.gate.outcome }})"
          commit-message: "deps: evaluate OpenClaw ${{ steps.ver.outputs.latest }} (compat gate ${{ steps.gate.outcome }})"
          labels: dependencies, needs-canary
          body: |
            Automated OpenClaw update check.

            | | |
            |---|---|
            | Pinned | `${{ steps.ver.outputs.pinned }}` |
            | Candidate | `${{ steps.ver.outputs.latest }}` |
            | Compat gate | **${{ steps.gate.outcome }}** |

            <details><summary>gate.log</summary>

            ```
            ${{ steps.gatelog.outputs.content }}
            ```
            </details>

            **Before merging:**
            1. If the gate failed, fix `src/compat/openclaw-sdk.ts` first; do not merge a FAIL.
            2. Run the live checklist in `docs/COMPAT.md` on a *secondary* Zalo test account.
            3. Follow `docs/UPGRADE.md` (backup, canary, rollback plan).

            This PR does not deploy anything.
